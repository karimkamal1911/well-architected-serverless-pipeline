name: Deploy Serverless Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          echo "Installing dependencies for all microservices..."
          for req in $(find src -name "requirements.txt"); do
            echo "Installing from $req"
            pip install -r $req
          done

      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
          python -m unittest discover -s src -p "test_*.py"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM Template
        run: |
          echo "Validating Infrastructure as Code..."
          sam validate --lint -t infrastructure/template.yaml

      - name: Build SAM Application
        run: |
          echo "Building Serverless Application..."
          sam build -t infrastructure/template.yaml

      - name: Simulate AWS Deployment
        run: |
          echo "✅ Application code validated."
          echo "✅ Dependencies installed."
          echo "✅ Unit tests passed."
          echo "✅ IaC Template is valid."
          echo "✅ SAM Build successful."
          echo "🚀 Ready for deployment!"

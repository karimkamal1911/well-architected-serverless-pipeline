name: Deploy Serverless Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          echo "Installing dependencies for all microservices..."
          for req in $(find src -name "requirements.txt"); do
            echo "Installing from $req"
            pip install -r $req
          done

      - name: Simulate AWS Deployment
        run: |
          echo "✅ Application code checked out successfully."
          echo "✅ Python environment validated."
          echo "✅ Dependencies installed across all microservices."
          echo "🚀 Simulating deployment of Step Functions and Lambda functions to AWS..."
          echo "Deployment successful!"

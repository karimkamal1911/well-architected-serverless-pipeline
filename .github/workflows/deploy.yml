name: Deploy Serverless Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          echo "Installing dependencies for all microservices..."
          for req in $(find src -name "requirements.txt"); do
            echo "Installing from $req"
            pip install -r $req
          done

      - name: Validate IaC Syntax
        run: |
          python -m pip install pyyaml
          echo "Validating Infrastructure as Code Syntax..."
          python -c "import yaml; yaml.safe_load(open('infrastructure/template.yaml'))"
          echo "✅ IaC Template is valid."

      - name: Simulate AWS Deployment
        run: |
          echo "✅ Application code validated."
          echo "✅ Dependencies installed."
          echo "✅ IaC Template syntax is valid."
          echo "🚀 Ready for deployment! (Skipped to avoid AWS charges)"

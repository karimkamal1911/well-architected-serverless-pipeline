AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Image Processing Pipeline

Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive failure alerts

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Architectures:
      - x86_64
    Tracing: Active

Resources:
  IngestBucket:
    Type: AWS::S3::Bucket
    DependsOn: ImageProcessingQueuePolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-ingest-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt ImageProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  DestinationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-destination-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER

  DestinationBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DestinationBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DestinationBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}"

  FailureSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ImagePipelineFailures

  FailureSNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FailureSNSTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ImageProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageProcessingDLQ.Arn
        maxReceiveCount: 5

  ImageProcessingDLQ:
    Type: AWS::SQS::Queue

  ImageProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ImageProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ImageProcessingQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-ingest-${AWS::AccountId}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ImageMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ImageId
          AttributeType: S
      KeySchema:
        - AttributeName: ImageId
          KeyType: HASH

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdasAndSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: 
                  - !GetAtt ValidateFunction.Arn
                  - !GetAtt ResizeFunction.Arn
                  - !GetAtt WatermarkFunction.Arn
                  - !GetAtt ExtractMetadataFunction.Arn
                  - !GetAtt StoreFunction.Arn
              - Effect: Allow
                Action: 'sns:Publish'
                Resource: !Ref FailureSNSTopic
              - Effect: Allow
                Action: 'xray:PutTraceSegments'
                Resource: '*'

  ImageProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: ImageProcessingWorkflow
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Tracing:
        Enabled: true
      DefinitionUri: ../statemachine/definition.asl.json
      DefinitionSubstitutions:
        ValidateFunctionArn: !GetAtt ValidateFunction.Arn
        ResizeFunctionArn: !GetAtt ResizeFunction.Arn
        WatermarkFunctionArn: !GetAtt WatermarkFunction.Arn
        ExtractMetadataFunctionArn: !GetAtt ExtractMetadataFunction.Arn
        StoreFunctionArn: !GetAtt StoreFunction.Arn
        SNSTopicArn: !Ref FailureSNSTopic

  GenerateUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/generate_url/
      Handler: app.lambda_handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref IngestBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref IngestBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /upload
            Method: post
            Auth:
              ApiKeyRequired: true

  PollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/poller/
      Handler: app.lambda_handler
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ImageProcessingStateMachine
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          TABLE_NAME: !Ref ImageMetadataTable
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt ImageProcessingQueue.QueueName
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt ImageProcessingStateMachine.Name
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageMetadataTable
        - Statement:
            - Effect: Allow
              Action: 'states:DescribeExecution'
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${ImageProcessingStateMachine.Name}:*"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageProcessingQueue.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/steps/validate/
      Handler: app.lambda_handler
      MemorySize: 512
      Layers:
        - !Ref ImageProcessingLayer
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref IngestBucket

  ResizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/steps/resize/
      Handler: app.lambda_handler
      MemorySize: 1024
      Layers:
        - !Ref ImageProcessingLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref IngestBucket

  WatermarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/steps/watermark/
      Handler: app.lambda_handler
      MemorySize: 1024
      Layers:
        - !Ref ImageProcessingLayer
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref IngestBucket

  ExtractMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/steps/extract_metadata/
      Handler: app.lambda_handler
      MemorySize: 512
      Layers:
        - !Ref ImageProcessingLayer
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref IngestBucket

  StoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/steps/store/
      Handler: app.lambda_handler
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ImageMetadataTable
          DEST_BUCKET: !Ref DestinationBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref IngestBucket
        - S3WritePolicy:
            BucketName: !Ref DestinationBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageMetadataTable

  ImageProcessingLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: PillowLayer
      Description: Pillow library for image processing
      ContentUri: ../layers/image-processing/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  ImageApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      TracingEnabled: true

  ImageApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
        - ApiId: !Ref ImageApi
          Stage: Prod
      Throttle:
        BurstLimit: 100
        RateLimit: 50

  ImageApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      StageKeys:
        - RestApiId: !Ref ImageApi
          StageName: Prod

  ImageApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ImageApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ImageApiUsagePlan

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: DestinationBucketOAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: DestinationBucketOrigin
            DomainName: !GetAtt DestinationBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: DestinationBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm if there are messages in the Dead Letter Queue"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ImageProcessingDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref FailureSNSTopic

  StateMachineFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm if Step Functions workflow fails"
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref ImageProcessingStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref FailureSNSTopic

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm if any Lambda function throws an error"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PollerFunction
        - Name: FunctionName
          Value: !Ref ValidateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref FailureSNSTopic
